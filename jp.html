<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title> 5x5 经典老虎机 · Casino Lucky Slots</title>
<style>
:root {
  --dh: 64px; --rw: 64px; --gap: 8px; --fs: 44px;
  --machine-w: 400px; --reel-h: calc(var(--dh) * 5);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:radial-gradient(ellipse at center,#1a0a2e 0%,#05010f 100%);
  color:#e0d5c0; font-family:'Microsoft YaHei','PingFang SC',sans-serif;
  display:flex;flex-direction:column;align-items:center;
  min-height:100vh;padding:15px; user-select:none; overflow-x:hidden;
}
h1{
  font-size:26px;
  background:linear-gradient(90deg,#fbbf24,#f472b6,#a78bfa,#fbbf24);
  background-size:200% 100%; -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  animation:shine 3s linear infinite; margin-bottom:4px; letter-spacing:2px; text-align:center;
}
@keyframes shine{0%{background-position:0% 50%}100%{background-position:200% 50%}}
.sub{font-size:13px;color:#888;margin-bottom:16px;text-align:center}

.machine-wrapper{position:relative;display:flex;align-items:center;justify-content:center;margin-bottom:20px;width:100%;max-width:480px;}
.machine{
  position:relative; width:var(--machine-w); max-width:100%;
  background:linear-gradient(145deg,#2a1a4a 0%,#1a0a2e 50%,#0f0520 100%);
  border:3px solid #fbbf24; border-radius:24px; padding:20px 15px 15px;
  box-shadow:0 0 40px rgba(251,191,36,.3),inset 0 0 30px rgba(0,0,0,.6),0 10px 40px rgba(0,0,0,.5);
}
.machine::before{
  content:'';position:absolute;top:-3px;left:-3px;right:-3px;bottom:-3px;border-radius:24px;
  background:linear-gradient(45deg,#fbbf24,#f472b6,#a78bfa,#fbbf24);
  background-size:300% 300%; animation:borderGlow 4s ease infinite; z-index:-1;opacity:.6;filter:blur(8px);
}
@keyframes borderGlow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}

/* ================= 拉杆结构 - 底座紧贴面板 ================= */
.arm-container{
  position:absolute; 
  /* 关键：容器右边缘与机器右边缘对齐 */
  right:0; 
  top:50%; 
  transform:translateY(-50%);
  width:60px; 
  height:300px; 
  z-index:20; 
  pointer-events:none; 
}

/* 1. 底座 - 左边缘紧贴机器右边缘，向右延伸 */
.arm-base{
  position:absolute; 
  top:50%; 
  transform:translateY(-50%);
  left:0; /* 左边缘对齐容器左边缘 = 机器右边缘 */
  width:50px; 
  height:80px;
  background:linear-gradient(180deg,#d4af37 0%,#b8860b 50%,#8b6914 100%);
  border-radius:0 8px 8px 0; 
  border:2px solid #fbbf24; 
  border-left:none; /* 左侧无边框，与机器无缝融合 */
  box-shadow:4px 4px 15px rgba(0,0,0,.6), inset 0 2px 4px rgba(255,255,255,.3);
  z-index: 1;
  pointer-events:auto;
}
.arm-base::before{
  content:''; 
  position:absolute; 
  top:50%; 
  left:50%; 
  transform:translate(-50%,-50%);
  width:30px; 
  height:30px; 
  background:radial-gradient(circle,#fbbf24,#b8860b);
  border-radius:50%; 
  border:2px solid #d4af37;
  box-shadow:inset 0 2px 4px rgba(255,255,255,.4);
}

/* 2. 杆身 - 居中于底座 (底座宽50px, 中心在25px) */
.arm-rod{
  position:absolute; 
  left:25px; /* 底座中心 */
  transform:translateX(-50%); 
  width:14px; 
  background:linear-gradient(90deg,#8b6914,#d4af37,#fbbf24,#d4af37,#8b6914);
  border-radius:7px;
  box-shadow:2px 2px 12px rgba(0,0,0,.5);
  z-index: 2;
  pointer-events:none;
}

/* 3. 金色球体把手 - 居中于底座 */
.arm-handle{
  position:absolute; 
  left:25px; /* 底座中心 */
  transform:translateX(-50%);
  width:50px; 
  height:50px;
  background:radial-gradient(circle at 35% 35%,#fff4a3,#d4af37 40%,#8b6914 80%,#5c4a0a);
  border-radius:50%; 
  border:3px solid #fbbf24;
  box-shadow:0 6px 20px rgba(0,0,0,.6), inset 0 3px 8px rgba(255,255,255,.5);
  cursor:grab; 
  touch-action:none;
  z-index: 3;
  pointer-events:auto;
}
.arm-handle:active{cursor:grabbing}
.arm-handle::after{
  content:''; 
  position:absolute; 
  top:10px; 
  left:12px;
  width:16px; 
  height:10px; 
  background:rgba(255,255,255,.6);
  border-radius:50%; 
  transform:rotate(-30deg);
}

.reels-container{position:relative;background:#000;padding:12px;border-radius:14px;border:2px solid #555;box-shadow:inset 0 0 20px rgba(0,0,0,.9);}
.reels{display:flex;gap:var(--gap);justify-content:center}
.reel{
  position:relative;width:var(--rw);height:var(--reel-h);
  background:linear-gradient(180deg,#0a0a15 0%,#1a1a2e 50%,#0a0a15 100%);
  border-radius:8px;overflow:hidden;border:1px solid #333; transition:box-shadow .3s;flex-shrink:0;
}
.reel::before,.reel::after{content:'';position:absolute;left:0;right:0;height:calc(var(--dh) * 1.5);z-index:3;pointer-events:none;}
.reel::before{top:0;background:linear-gradient(180deg,rgba(0,0,0,.95) 0%,rgba(0,0,0,0) 100%)}
.reel::after{bottom:0;background:linear-gradient(0deg,rgba(0,0,0,.95) 0%,rgba(0,0,0,0) 100%)}
.strip{position:absolute;left:0;right:0;top:0;will-change:transform}
.digit{height:var(--dh);display:flex;align-items:center;justify-content:center;font-size:var(--fs);font-weight:900;line-height:1;text-shadow:0 0 10px currentColor;}

#paylines-svg{position:absolute;top:12px;left:12px;width:calc(100% - 24px);height:calc(100% - 24px);pointer-events:none;z-index:10;overflow:visible;}
.payline-path{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;opacity:0;filter:drop-shadow(0 0 6px currentColor);transition:opacity 0.3s;}
.payline-path.active{opacity:1;animation:paylinePulse 0.8s ease-in-out infinite alternate}
@keyframes paylinePulse{from{stroke-width:4; filter:drop-shadow(0 0 6px currentColor); opacity: 0.8}to{stroke-width:7; filter:drop-shadow(0 0 15px currentColor); opacity: 1}}

.result-box{margin-top:16px;padding:12px 20px;background:rgba(0,0,0,.5);border:1px solid #555;border-radius:10px;text-align:center;display:flex;flex-direction:column;gap:8px;}
.result-label{color:#fbbf24;font-size:14px;font-weight:bold;letter-spacing:1px}
.result-numbers{display:flex;gap:8px;justify-content:center}
.result-digit{font-size:36px;font-weight:900;min-width:40px;text-align:center;text-shadow:0 0 15px currentColor;opacity:.3;transition:opacity .3s,transform .3s;}
.result-digit.landed{opacity:1;animation:digitPop .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes digitPop{0%{transform:scale(1.5);opacity:0}60%{transform:scale(.9)}100%{transform:scale(1);opacity:1}}

.casino-board{
  margin-top:12px;padding:12px 20px;
  background:linear-gradient(145deg,#1e293b,#0f172a);
  border:2px solid #fbbf24;border-radius:12px;
  display:grid; grid-template-columns: 1fr 1fr 1fr; gap:10px;
  box-shadow:0 0 20px rgba(251,191,36,.3); width:var(--machine-w); max-width:100%;
}
.stat-box{text-align:center;}
.stat-label{color:#94a3b8;font-size:12px;margin-bottom:4px;}
.stat-value{font-size:20px;font-weight:bold;text-shadow:0 0 10px currentColor;}
.val-balance{color:#22c55e;}
.val-bet{color:#fbbf24;}
.val-jackpot{color:#f472b6; font-size:18px;}

#message{
  margin-top:12px;padding:8px 20px;font-size:15px;color:#fbbf24;
  min-height:32px;text-align:center;text-shadow:0 0 10px rgba(251,191,36,.5);
  opacity:0;transition:opacity .4s;white-space: pre-wrap; width:var(--machine-w);max-width:100%;
}
#message.show{opacity:1}
.firework{position:fixed;width:6px;height:6px;border-radius:50%;pointer-events:none;z-index:100}

@media (max-width: 480px) {
  :root { 
    --dh: 44px; 
    --rw: 44px; 
    --gap: 5px; 
    --fs: 30px; 
    --machine-w: 280px;
  }
  body { padding: 10px; overflow-x: hidden; }
  h1 { font-size: 20px; } 
  .sub { font-size: 11px; }
  .result-digit { font-size: 24px; min-width: 28px; }
  #message { font-size: 12px; padding: 6px 10px; }
  .stat-value { font-size: 15px; }
  .val-jackpot { font-size: 13px; }
  
  .machine-wrapper {
    width: 100%;
    justify-content: center;
    padding-right: 30px;
  }
  
  .arm-container { 
    right: 0; /* 仍然紧贴 */
    transform: translateY(-50%) scale(0.75);
    transform-origin: center right;
  }
}
</style>
</head>
<body>
<h1> 5x5 CASINO SLOTS 🎰</h1>
<p class="sub">拖拽金色拉杆 · 53条支付线 · 仅5连中奖 · 累积奖池</p>

<div class="machine-wrapper">
  <div class="machine">
    <div class="reels-container">
      <div class="reels" id="reels"></div>
      <svg id="paylines-svg" viewBox="0 0 352 320" preserveAspectRatio="none"></svg>

<script>
const SYMBOLS = [
  { icon: '🍒', color: '#ef4444', name: 'Cherry' },
  { icon: '🔔', color: '#eab308', name: 'Bell' },
  { icon: '🍉', color: '#22c55e', name: 'Melon' },
  { icon: '🍌', color: '#facc15', name: 'Banana' },
  { icon: 'BAR', color: '#3b82f6', name: 'Bar' },
  { icon: '3BAR', color: '#a855f7', name: '3Bar' },
  { icon: '7', color: '#f97316', name: 'Seven' }
];

const REEL_COUNT = 5, ROWS = 5, SYMBOL_COUNT = 7;
function getCSSVar(name) { return parseInt(getComputedStyle(document.documentElement).getPropertyValue(name)); }
let DIGIT_HEIGHT = getCSSVar('--dh');

const MAX_VELOCITY = 6000, ACCELERATION = 14000, FRICTION = 0.94;
const SNAP_THRESHOLD = 500, SNAP_STRENGTH = 0.45, STOP_THRESHOLD = 12;

const reels = [];
let spinning = false, stopSequence = [], lastTime = 0, resultGrid = [];

let balance = 1000, currentBet = 10, jackpot = 500, spinCount = 0;

const armContainer = document.getElementById('arm-container');
const armRod = document.getElementById('arm-rod');
const armHandle = document.getElementById('arm-handle');

let isDragging = false, dragStartY = 0, currentBallY = 0;
const CONTAINER_HEIGHT = 300;
const CENTER_Y = CONTAINER_HEIGHT / 2;
const MAX_PULL = CONTAINER_HEIGHT - 50;

let audioCtx = null, masterGain = null, spinOsc = null, spinGain = null;
function initAudio(){
  if(audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain(); masterGain.gain.value = 0.5; masterGain.connect(audioCtx.destination);
}

function playPaylineSound(points) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const baseFreq = 200 + (points / 100) * 400;
  if (points <= 20) {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.connect(g); g.connect(masterGain); o.type = 'sine'; o.frequency.value = baseFreq;
    g.gain.setValueAtTime(0.3, t); g.gain.exponentialRampToValueAtTime(0.01, t + 0.3);
    o.start(t); o.stop(t + 0.3);
  } else if (points <= 50) {
    [baseFreq, baseFreq * 1.25].forEach((f, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.connect(g); g.connect(masterGain); o.type = 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(0, t + i * 0.1); g.gain.linearRampToValueAtTime(0.2, t + i * 0.1 + 0.05);
      g.gain.exponentialRampToValueAtTime(0.01, t + i * 0.1 + 0.2);
      o.start(t + i * 0.1); o.stop(t + i * 0.1 + 0.2);
    });
  } else {
    [baseFreq, baseFreq * 1.25, baseFreq * 1.5].forEach((f, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.connect(g); g.connect(masterGain); o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0, t + i * 0.08); g.gain.linearRampToValueAtTime(0.25, t + i * 0.08 + 0.03);
      g.gain.exponentialRampToValueAtTime(0.01, t + i * 0.08 + 0.25);
      o.start(t + i * 0.08); o.stop(t + i * 0.08 + 0.25);
    });
  }
}

function playStart(){
  if(!audioCtx) return; const t = audioCtx.currentTime;
  const o1 = audioCtx.createOscillator(), g1 = audioCtx.createGain();
  o1.connect(g1); g1.connect(masterGain); o1.type = 'sawtooth';
  o1.frequency.setValueAtTime(80, t); o1.frequency.exponentialRampToValueAtTime(400, t + 0.2);
  g1.gain.setValueAtTime(0.25, t); g1.gain.exponentialRampToValueAtTime(0.01, t + 0.25);
  o1.start(t); o1.stop(t + 0.25);
}
function startSpinSound(){
  if(!audioCtx || spinOsc) return;
  spinOsc = audioCtx.createOscillator(); spinGain = audioCtx.createGain();
  const filter = audioCtx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 1200;
  spinOsc.connect(filter); filter.connect(spinGain); spinGain.connect(masterGain);
  spinOsc.type = 'sawtooth'; spinOsc.frequency.value = 180; spinGain.gain.value = 0.06; spinOsc.start();
}
function updateSpinSound(){
  if(!spinOsc) return;
  const maxV = Math.max(...reels.map(r => Math.abs(r.velocity)));
  const ratio = maxV / MAX_VELOCITY;
  spinOsc.frequency.setTargetAtTime(180 + ratio * 500, audioCtx.currentTime, 0.05);
  spinGain.gain.setTargetAtTime(0.04 + ratio * 0.08, audioCtx.currentTime, 0.05);
}
function stopSpinSound(){
  if(!spinOsc) return;
  spinGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
  spinOsc.stop(audioCtx.currentTime + 0.2); spinOsc = null; spinGain = null;
}
function playTick(reelIndex){
  if(!audioCtx) return; const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.connect(g); g.connect(masterGain); o.type = 'square';
  o.frequency.setValueAtTime(900 - reelIndex * 80, t);
  o.frequency.exponentialRampToValueAtTime(400, t + 0.04);
  g.gain.setValueAtTime(0.1, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
  o.start(t); o.stop(t + 0.05);
}
function playStop(reelIndex){
  if(!audioCtx) return; const t = audioCtx.currentTime;
  const o1 = audioCtx.createOscillator(), g1 = audioCtx.createGain();
  o1.connect(g1); g1.connect(masterGain); o1.type = 'square';
  o1.frequency.setValueAtTime(200, t); o1.frequency.exponentialRampToValueAtTime(60, t + 0.15);
  g1.gain.setValueAtTime(0.3, t); g1.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
  o1.start(t); o1.stop(t + 0.2);
}
function playJackpotSound(){
  if(!audioCtx) return; const t = audioCtx.currentTime;
  [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.connect(g); g.connect(masterGain); o.type = 'triangle'; o.frequency.value = f;
    g.gain.setValueAtTime(0, t + i * 0.1); g.gain.linearRampToValueAtTime(0.3, t + i * 0.1 + 0.05);
    g.gain.exponentialRampToValueAtTime(0.01, t + i * 0.1 + 0.5);
    o.start(t + i * 0.1); o.stop(t + i * 0.1 + 0.5);
  });
}

function shuffleArray(arr){
  const a = [...arr];
  for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

const lineBetArray = [
    [3, 3, 3, 3, 3], [2, 2, 2, 2, 2], [4, 4, 4, 4, 4], [1, 1, 1, 1, 1], [5, 5, 5, 5, 5],
    [1, 3, 5, 3, 1], [5, 3, 1, 3, 5], [1, 2, 3, 4, 5], [5, 4, 3, 2, 1], [2, 4, 2, 4, 2],
    [4, 2, 4, 2, 4], [1, 2, 1, 2, 1], [5, 4, 5, 4, 5], [2, 1, 2, 1, 2], [4, 5, 4, 5, 4],
    [3, 2, 3, 2, 3], [3, 4, 3, 4, 3], [3, 4, 5, 4, 3], [3, 2, 1, 2, 3], [2, 3, 2, 3, 2],
    [4, 3, 4, 3, 4], [1, 2, 3, 2, 1], [5, 4, 3, 4, 5], [2, 3, 4, 3, 2], [4, 3, 2, 3, 4],
    [1, 2, 2, 2, 1], [5, 4, 4, 4, 5], [2, 1, 1, 1, 2], [4, 5, 5, 5, 4], [2, 4, 4, 4, 2],
    [4, 2, 2, 2, 4], [2, 3, 3, 3, 2], [4, 3, 3, 3, 4], [3, 2, 2, 2, 3], [3, 4, 4, 4, 3],
    [3, 3, 2, 3, 3], [3, 3, 4, 3, 3], [2, 2, 3, 2, 2], [4, 4, 3, 4, 4], [2, 2, 1, 2, 2],
    [4, 4, 5, 4, 4], [1, 1, 2, 1, 1], [5, 5, 4, 5, 5], [1, 4, 4, 4, 1], [5, 2, 2, 2, 5],
    [3, 1, 1, 1, 3], [4, 1, 1, 1, 4], [5, 1, 1, 1, 5], [1, 3, 3, 3, 1], [5, 3, 3, 3, 5],
    [3, 5, 5, 5, 3], [2, 5, 5, 5, 2], [1, 5, 5, 5, 1]
];

const COLORS = ['#fbbf24', '#f472b6', '#a78bfa', '#22c55e', '#3b82f6', '#ef4444', '#14b8a6', '#f97316', '#8b5cf6', '#ec4899'];

const PAYLINES = lineBetArray.map((pattern, index) => {
  const coords = pattern.map((row, col) => [col, row - 1]);
  return {
    name: `Line ${index + 1}`,
    color: COLORS[index % COLORS.length],
    coords: coords,
    points: 10 + (index % 5) * 10
  };
});

function createSymbolHTML(symIdx) {
  const sym = SYMBOLS[symIdx];
  if (sym.icon.length > 2) return `<div class="digit" style="color:${sym.color}"><span style="font-size:0.55em; font-weight:900">${sym.icon}</span></div>`;
  return `<div class="digit" style="color:${sym.color}">${sym.icon}</div>`;
}

function buildReels(){
  const container = document.getElementById('reels'); container.innerHTML = '';
  const svg = document.getElementById('paylines-svg'); svg.innerHTML = '';
  PAYLINES.forEach((line, idx) => {
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
    path.setAttribute('class', 'payline-path'); path.setAttribute('id', `payline-${idx}`);
    path.setAttribute('stroke', line.color); svg.appendChild(path);
  });
  for(let r = 0; r < REEL_COUNT; r++){
    const reel = document.createElement('div'); reel.className = 'reel';
    const strip = document.createElement('div'); strip.className = 'strip';
    const cycles = 50; const symbolOrder = shuffleArray([0,1,2,3,4,5,6]);
    let html = '';
    for(let c = 0; c < cycles; c++) symbolOrder.forEach(s => { html += createSymbolHTML(s); });
    strip.innerHTML = html; reel.appendChild(strip); container.appendChild(reel);
    const totalHeight = cycles * SYMBOL_COUNT * DIGIT_HEIGHT;
    reels.push({ element: reel, strip: strip, symbolOrder: symbolOrder, position: totalHeight / 2, velocity: 0, targetSymbol: null, targetIndex: null, stopped: false, lastSymbol: -1, decelerating: false, totalHeight: totalHeight, cycleHeight: SYMBOL_COUNT * DIGIT_HEIGHT });
  }
}

function renderReel(reel){
  const renderPos = reel.position - 2 * DIGIT_HEIGHT;
  reel.strip.style.transform = `translateY(${-renderPos}px)`;
  const cycleHeight = reel.cycleHeight;
  let posInCycle = reel.position % cycleHeight; if (posInCycle < 0) posInCycle += cycleHeight;
  const currentSymbolIndex = Math.floor(posInCycle / DIGIT_HEIGHT) % SYMBOL_COUNT;
  const currentSymbol = reel.symbolOrder[currentSymbolIndex];
  if(currentSymbol !== reel.lastSymbol && Math.abs(reel.velocity) > 30){ playTick(reels.indexOf(reel)); reel.lastSymbol = currentSymbol; }
}

function physicsLoop(time){
  if(!spinning && reels.every(r => r.stopped)) return;
  if(!lastTime) lastTime = time; const dt = Math.min((time - lastTime) / 1000, 0.05); lastTime = time;
  const now = time;
  reels.forEach((reel, idx) => {
    if(reel.stopped) return;
    if(stopSequence[idx] !== undefined && now >= stopSequence[idx]) reel.decelerating = true;
    if(!reel.decelerating) reel.velocity = Math.min(reel.velocity + ACCELERATION * dt, MAX_VELOCITY);
    else {
      reel.velocity *= Math.pow(FRICTION, dt * 60);
      const cycleHeight = reel.cycleHeight;
      let posInCycle = reel.position % cycleHeight; if(posInCycle < 0) posInCycle += cycleHeight;
      const targetPos = reel.targetIndex * DIGIT_HEIGHT;
      let diff = targetPos - posInCycle;
      while(diff > cycleHeight / 2) diff -= cycleHeight; while(diff < -cycleHeight / 2) diff += cycleHeight;
      if(Math.abs(reel.velocity) < SNAP_THRESHOLD){ reel.velocity += diff * SNAP_STRENGTH * dt * 60; reel.velocity *= 0.85; }
      if(Math.abs(reel.velocity) < STOP_THRESHOLD && Math.abs(diff) < 1.5){
        reel.position = reel.position - posInCycle + targetPos; reel.velocity = 0; reel.stopped = true; onReelStopped(idx, reel.targetSymbol);
      }
    }
    reel.position += reel.velocity * dt;
    if(reel.position > reel.totalHeight - reel.cycleHeight * 2) reel.position -= reel.cycleHeight * 10;
    renderReel(reel);
  });
  updateSpinSound();
  if(!reels.every(r => r.stopped)) requestAnimationFrame(physicsLoop); else onAllStopped();
}

function onReelStopped(idx, symbolIdx){
  playStop(idx);
  const cycleHeight = reels[idx].cycleHeight;
  let posInCycle = reels[idx].position % cycleHeight; if(posInCycle < 0) posInCycle += cycleHeight;
  const centerIdx = Math.floor(posInCycle / DIGIT_HEIGHT) % SYMBOL_COUNT;
  resultGrid[idx] = [];
  for(let r = 0; r < ROWS; r++){ let rowIdx = (centerIdx - 2 + r + SYMBOL_COUNT) % SYMBOL_COUNT; resultGrid[idx][r] = reels[idx].symbolOrder[rowIdx]; }
  const digitEl = document.querySelector(`.result-digit[data-i="${idx}"]`);
  const sym = SYMBOLS[symbolIdx];
  const display = sym.icon.length > 2 ? `<span style="font-size:0.6em">${sym.icon}</span>` : sym.icon;
  digitEl.innerHTML = display; digitEl.style.color = sym.color;
  digitEl.classList.remove('landed'); void digitEl.offsetWidth; digitEl.classList.add('landed');
  const reel = reels[idx]; reel.element.style.boxShadow = `0 0 20px ${sym.color}`;
  setTimeout(() => { reel.element.style.boxShadow = '' }, 600);
}

function checkPaylines(){
  let wins = [];
  let totalWin = 0;
  const containerW = 352, containerH = 320;
  const cellW = containerW / REEL_COUNT, cellH = containerH / ROWS;

  PAYLINES.forEach((line, lineIdx) => {
    const path = document.getElementById(`payline-${lineIdx}`);
    const symbols = line.coords.map(([c, r]) => resultGrid[c][r]);

    let matchL = 1;
    for (let i = 1; i < 5; i++) { if (symbols[i] === symbols[0]) matchL++; else break; }

    let matchR = 1;
    for (let i = 3; i >= 0; i--) { if (symbols[i] === symbols[4]) matchR++; else break; }

    let lineWin = 0;
    let is5L = matchL === 5;
    let is5R = matchR === 5;

    if (is5L) {
      let win = line.points * 3 * currentBet;
      if (symbols[0] === 6) {
        win += jackpot;
        wins.push(`🏆 JACKPOT! L→R 5x7! +${Math.floor(win)}`);
        jackpot = 500;
        playJackpotSound();
      } else {
        wins.push(`L→R 5连 ${SYMBOLS[symbols[0]].name} +${win}`);
        playPaylineSound(win);
      }
      lineWin += win;
    }

    if (is5R && !(is5L && symbols[0] === symbols[4])) {
      let win = line.points * 3 * currentBet;
      if (symbols[4] === 6) {
        if (is5L && symbols[0] === 6) {
           win = line.points * 3 * currentBet; 
        } else {
           win += jackpot;
           wins.push(`🏆 JACKPOT! R→L 5x7! +${Math.floor(win)}`);
           jackpot = 500;
           playJackpotSound();
        }
      } else {
        wins.push(`R→L 5连 ${SYMBOLS[symbols[4]].name} +${win}`);
        playPaylineSound(win);
      }
      lineWin += win;
    }

    if (is5L || is5R) {
      const pts = line.coords.map(([c, r]) => `${c * cellW + cellW / 2},${r * cellH + cellH / 2}`).join(' ');
      path.setAttribute('points', pts);
      path.classList.add('active');
    } else {
      path.classList.remove('active');
    }

    totalWin += lineWin;
  });

  return { wins, totalWin };
}

function updateUI() {
  document.getElementById('val-balance').textContent = Math.floor(balance);
  document.getElementById('val-bet').textContent = currentBet;
  document.getElementById('val-jackpot').textContent = Math.floor(jackpot);
}

function onAllStopped(){
  stopSpinSound(); spinning = false;
  
  const { wins, totalWin } = checkPaylines();
  const msg = document.getElementById('message');
  
  if (totalWin > 0) {
    balance += totalWin;
    msg.textContent = `🎉 中奖! (仅5连)\n${wins.slice(0, 5).join('\n')}${wins.length > 5 ? '\n... 等 ' + wins.length + ' 条线' : ''}\n总赢取: +${Math.floor(totalWin)}`;
    spawnFireworks();
  } else {
    msg.textContent = `🎲 未中奖 (需要5连)\n余额: ${Math.floor(balance)} | 下注: ${currentBet}`;
  }
  msg.classList.add('show');
  updateUI();
  
  spinCount++;
  if (spinCount % 3 === 0) {
    currentBet += 5;
  }
  
  clearTimeout(onAllStopped._t);
  onAllStopped._t = setTimeout(() => { msg.classList.remove('show'); }, 5000);
}

function spawnFireworks(){
  const colors = ['#fbbf24', '#f472b6', '#a78bfa', '#22c55e', '#3b82f6', '#ef4444'];
  for(let burst = 0; burst < 5; burst++){
    setTimeout(() => {
      const cx = Math.random() * window.innerWidth, cy = Math.random() * window.innerHeight * 0.6;
      for(let i = 0; i < 20; i++){
        const p = document.createElement('div'); p.className = 'firework';
        p.style.background = colors[Math.floor(Math.random() * colors.length)];
        p.style.left = cx + 'px'; p.style.top = cy + 'px'; p.style.boxShadow = `0 0 8px ${p.style.background}`;
        document.body.appendChild(p);
        const angle = Math.random() * Math.PI * 2, dist = 80 + Math.random() * 120;
        p.animate([{transform: 'translate(0,0) scale(1)', opacity: 1},{transform: `translate(${Math.cos(angle)*dist}px,${Math.sin(angle)*dist}px) scale(0)`, opacity: 0}], {duration: 1000 + Math.random() * 500, easing: 'cubic-bezier(.2,.6,.4,1)'});
        setTimeout(() => p.remove(), 1500);
      }
    }, burst * 200);
  }
}

function updateLeverVisuals(ballY) {
  const centerY = CONTAINER_HEIGHT / 2;
  armHandle.style.top = ballY + 'px';

  if (ballY <= centerY) {
    const rodHeight = Math.max(0, centerY - ballY);
    armRod.style.height = rodHeight + 'px';
    armRod.style.bottom = '50%'; 
    armRod.style.top = 'auto';
  } else {
    const rodHeight = Math.max(0, ballY - centerY);
    armRod.style.height = rodHeight + 'px';
    armRod.style.top = '50%'; 
    armRod.style.bottom = 'auto';
  }
}

function easeOutBack(x) {
  const c1 = 1.70158;
  const c3 = c1 + 1;
  return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
}

function handleDragStart(e) {
  if (spinning) return;
  if (balance < currentBet) { alert('余额不足！请刷新页面重置。'); return; }
  e.preventDefault(); 
  isDragging = true;
  
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  const rect = armContainer.getBoundingClientRect();
  const mouseY = clientY - rect.top;
  dragStartY = mouseY - currentBallY;
}

function handleDragMove(e) {
  if (!isDragging) return; 
  e.preventDefault();
  
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  const rect = armContainer.getBoundingClientRect();
  let mouseY = clientY - rect.top;
  
  let ballY = Math.max(0, Math.min(mouseY - dragStartY, MAX_PULL));
  currentBallY = ballY;
  
  updateLeverVisuals(ballY);
}

function handleDragEnd(e) {
  if (!isDragging) return; 
  isDragging = false;
  
  const startY = currentBallY;
  const shouldSpin = startY >= MAX_PULL * 0.8;
  
  const duration = 400;
  const startTime = performance.now();
  
  function snapBackAnimation(time) {
    const elapsed = time - startTime;
    const progress = Math.min(elapsed / duration, 1);
    const easeProgress = easeOutBack(progress);
    
    const currentY = startY + (0 - startY) * easeProgress;
    currentBallY = currentY;
    
    updateLeverVisuals(currentY);
    
    if (progress < 1) {
      requestAnimationFrame(snapBackAnimation);
    } else {
      currentBallY = 0;
      updateLeverVisuals(0);
      if (shouldSpin) {
        startSpin();
      }
    }
  }
  
  requestAnimationFrame(snapBackAnimation);
}

armHandle.addEventListener('mousedown', handleDragStart);
armHandle.addEventListener('touchstart', handleDragStart, {passive: false});
document.addEventListener('mousemove', handleDragMove);
document.addEventListener('touchmove', handleDragMove, {passive: false});
document.addEventListener('mouseup', handleDragEnd);
document.addEventListener('touchend', handleDragEnd);

updateLeverVisuals(0);

function startSpin(){
  if(spinning) return;
  if (balance < currentBet) { const msg = document.getElementById('message'); msg.textContent = '余额不足！'; msg.classList.add('show'); return; }
  
  initAudio(); if(audioCtx.state === 'suspended') audioCtx.resume();
  
  balance -= currentBet;
  jackpot += currentBet * 0.1; 
  updateUI();
  
  spinning = true; lastTime = 0;
  resultGrid = Array(REEL_COUNT).fill(null).map(() => Array(ROWS).fill(0));
  PAYLINES.forEach((_, idx) => { document.getElementById(`payline-${idx}`).classList.remove('active'); });
  document.querySelectorAll('.result-digit').forEach(el => { el.textContent = '-'; el.classList.remove('landed'); el.style.color = '#888'; });
  document.getElementById('message').classList.remove('show');
  
  const startTime = performance.now(); stopSequence = [];
  reels.forEach((reel, idx) => {
    reel.velocity = 0; reel.stopped = false; reel.decelerating = false; reel.lastSymbol = -1;
    reel.targetSymbol = Math.floor(Math.random() * SYMBOL_COUNT);
    reel.targetIndex = reel.symbolOrder.indexOf(reel.targetSymbol);
    stopSequence[idx] = startTime + 1000 + idx * 500;
  });
  playStart(); startSpinSound(); requestAnimationFrame(physicsLoop);
}

buildReels(); reels.forEach(reel => { renderReel(reel); }); updateUI();
</script>
