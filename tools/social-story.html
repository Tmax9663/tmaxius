<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<title>Tmaxius 1080x1920</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body {
    font-family: "Noto Serif TC", "Songti TC", "PMingLiU", Georgia, serif;
    color: #201c15; position: relative;
    background:
      radial-gradient(58% 40% at 50% -6%, rgba(233,190,110,.60), transparent 64%),
      radial-gradient(50% 34% at 100% 108%, rgba(186,112,124,.24), transparent 70%),
      linear-gradient(180deg, #fbf7ef 0%, #f7efdf 46%, #eee1c9 100%);
  }
  body::after { content: ""; position: absolute; inset: 0;
    background-image: radial-gradient(rgba(32,28,21,.07) 1px, transparent 1px);
    background-size: 28px 28px; opacity: .4; }

  .rings { position: absolute; left: 50%; top: 300px; transform: translateX(-50%);
    width: 860px; height: 860px; }
  .rings i { position: absolute; inset: 0; border-radius: 50%; border: 3px solid rgba(139,82,16,.13); }
  .rings i:nth-child(2) { inset: 96px; border-style: dashed; border-color: rgba(139,82,16,.20); }
  .rings i:nth-child(3) { inset: 200px; border-color: rgba(124,35,51,.16); }
  .tri { position: absolute; inset: 0; display: flex; justify-content: center; align-items: flex-start;
    transform: rotate(var(--a)); font-family: serif; }
  .tri span { margin-top: 6.4%; font-size: 46px; color: rgba(139,82,16,.26);
    transform: rotate(calc(-1 * var(--a))); }

  .wrap { position: relative; z-index: 2; height: 100%; padding: 130px 96px 130px;
    display: flex; flex-direction: column; align-items: center; text-align: center; }

  .logo { width: 250px; height: 250px; filter: drop-shadow(0 18px 34px rgba(122,74,10,.3)); }
  .name { margin-top: 26px; font-size: 128px; line-height: 1; color: #8b5210; letter-spacing: .01em; }
  .sub { margin-top: 20px; font-family: "Segoe UI", "Noto Sans TC", sans-serif;
    font-size: 27px; letter-spacing: .5em; text-transform: uppercase; color: #a9721b; }

  .rule { height: 4px; width: 260px; margin: 60px 0 54px;
    background: linear-gradient(90deg, rgba(169,114,27,0), #a9721b, rgba(169,114,27,0)); }

  h1 { font-size: 86px; line-height: 1.32; font-weight: 600; letter-spacing: .01em; }
  h1 b { color: #7c2333; font-weight: 600; }

  .items { margin-top: 68px; display: flex; flex-direction: column; gap: 30px; text-align: left; }
  .item { display: flex; align-items: center; gap: 22px; font-size: 46px; color: #2c2620; }
  .item i { width: 20px; height: 20px; border-radius: 50%; flex: 0 0 auto;
    background: linear-gradient(145deg, #d9a84e, #8b5210); box-shadow: 0 4px 12px rgba(139,82,16,.35); }
  .item span em { font-style: normal; color: #6c6455; font-size: .74em; }

  .en { margin-top: 62px; font-family: "Segoe UI", "Noto Sans TC", sans-serif;
    font-size: 30px; line-height: 1.6; color: #6c6455; }

  .foot { margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 22px; }
  .url { font-family: Consolas, "Courier New", monospace; font-size: 52px; letter-spacing: .05em;
    color: #8b5210; background: #fff6e2; border: 4px solid #e2c48c; border-radius: 22px; padding: 18px 40px; }
  .loc { font-family: "Segoe UI", "Noto Sans TC", sans-serif; font-size: 30px; color: #7a6f5d; letter-spacing: .04em; }
</style>
</head>
<body>
  <div class="rings" aria-hidden="true">
    <i></i><i></i><i></i>
    <div class="tri" style="--a:0deg"><span>☰</span></div>
    <div class="tri" style="--a:45deg"><span>☱</span></div>
    <div class="tri" style="--a:90deg"><span>☲</span></div>
    <div class="tri" style="--a:135deg"><span>☳</span></div>
    <div class="tri" style="--a:180deg"><span>☴</span></div>
    <div class="tri" style="--a:225deg"><span>☵</span></div>
    <div class="tri" style="--a:270deg"><span>☶</span></div>
    <div class="tri" style="--a:315deg"><span>☷</span></div>
  </div>

  <div class="wrap">
    <img class="logo" src="../mylogo.png" alt="" />
    <div class="name">Tmaxius</div>
    <div class="sub">Smart Tech</div>

    <div class="rule"></div>

    <h1>軟體開發 ・ 手機 App<br><b>硬體整合</b></h1>

    <div class="items">
      <div class="item"><i></i><span>Kiosk 自助機 <em>／ POS 收銀</em></span></div>
      <div class="item"><i></i><span>Arduino ・ Raspberry Pi</span></div>
      <div class="item"><i></i><span>介面設計 ・ 平面印刷</span></div>
    </div>

    <div class="en">Full-stack development, mobile apps,<br>hardware integration and design.</div>

    <div class="foot">
      <span class="url">tmaxius.com</span>
      <span class="loc">Penang, Malaysia</span>
    </div>
  </div>
</body>
</html>
