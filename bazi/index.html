<!doctype html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="Author" content="tmax@tmaxius.com" />
    <link rel="icon" href="./favicon.png" />
    <title>命理精析 · 經典八字排盤</title>
    <style>
        /* ─── Reset & Variables ─── */
        :root {
            --primary: #8c1c13;
            --primary-hover: #6e150f;
            --gold: #c59b27;
            --gold-light: #fbf7eb;
            --bg: #f4efe6;
            --card: #ffffff;
            --text: #2b2b2b;
            --muted: #666666;
            --border: #e2d9cc;
            --radius: 12px;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            --font: "Zen Maru Gothic";
            /* -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
         @font-face {
            font-family: "Zen Maru Gothic";
            src: URL("./ZenMaruGothic-Light.ttf") format("truetype");
          }
        body {
            font-family: var(--font);
            background: var(--bg);
            background-image: radial-gradient(var(--border) 1px, transparent 1px);
            background-size: 24px 24px;
            color: var(--text);
            padding: 20px 12px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ─── Container ─── */
        .container {
            width: 100%;
            max-width: 680px;
            background: var(--card);
            padding: 28px 24px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
            margin-bottom: 24px;
        }

        .container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--primary), var(--gold), var(--primary));
        }

        /* ─── Header ─── */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .header-left h2 {
            color: var(--primary);
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 2px;
            line-height: 1.2;
        }

        .header-left p {
            font-size: 0.82rem;
            color: var(--muted);
            letter-spacing: 0.5px;
        }

        .settings-btn {
            background: transparent;
            border: 1px solid #ccc;
            border-radius: 50%;
            width: 42px;
            height: 42px;
            cursor: pointer;
            font-size: 1.3rem;
            transition: background 0.2s, transform 0.1s;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .settings-btn:hover {
            background: #f0f0f0;
            transform: scale(1.05);
        }

        /* ─── Profile Bar ─── */
        .profile-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            background: var(--gold-light);
            border: 1px solid rgba(197, 155, 39, 0.3);
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 22px;
        }

        .profile-bar select {
            flex: 1 1 160px;
            min-width: 120px;
            border: 1px solid var(--border);
            background: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            color: var(--text);
            outline: none;
        }

        .profile-bar .btn-danger {
            flex-shrink: 0;
            background: #e63946;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: background 0.2s;
        }

        .profile-bar .btn-danger:hover {
            background: #c92a37;
        }

        /* ─── Form ─── */
        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 0.92rem;
            color: var(--text);
        }

        input[type="text"],
        input[type="datetime-local"] {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.98rem;
            outline: none;
            background: #fafafa;
            transition: border 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(140, 28, 19, 0.1);
        }

        /* Gender segmented */
        .gender-segmented {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .gender-option {
            position: relative;
        }

        .gender-option input[type="radio"] {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        .gender-label {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #fafafa;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
            font-size: 0.95rem;
        }

        .gender-option input[type="radio"]:checked+.gender-label {
            border-color: var(--primary);
            background: rgba(140, 28, 19, 0.06);
            color: var(--primary);
        }

        /* Submit */
        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: #fff;
            border: none;
            padding: 14px;
            font-size: 1.05rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            letter-spacing: 1px;
            box-shadow: 0 4px 12px rgba(140, 28, 19, 0.25);
            transition: transform 0.1s, box-shadow 0.2s;
            margin-top: 6px;
        }

        .btn-submit:hover {
            box-shadow: 0 6px 16px rgba(140, 28, 19, 0.35);
        }

        .btn-submit:active {
            transform: scale(0.99);
        }

        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        /* Loading */
        .loading-text {
            text-align: center;
            color: var(--primary);
            font-weight: 600;
            display: none;
            margin: 18px 0 8px;
            font-size: 0.95rem;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%,
            100% {
                opacity: 0.6;
            }
            50% {
                opacity: 1;
            }
        }

        /* Report iframe & print */
        #report-preview {
            width: 100%;
            max-width: 900px;
            height: 750px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            background: #fff;
            display: none;
        }

        .btn-print {
            background: #2b2d42;
            color: #fff;
            border: none;
            padding: 12px 28px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.95rem;
            margin-bottom: 20px;
            display: none;
            box-shadow: var(--shadow);
            transition: transform 0.2s, background 0.2s;
        }

        .btn-print:hover {
            transform: translateY(-2px);
            background: #1e1f2e;
        }

        /* ─── API Key Modal ─── */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-card {
            background: #ffffff;
            padding: 28px 24px;
            border-radius: 12px;
            max-width: 460px;
            width: 92%;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-title {
            margin-top: 0;
            margin-bottom: 14px;
            font-size: 1.25rem;
            color: var(--primary);
        }

        .modal-instruction {
            font-size: 0.9rem;
            color: #444;
            line-height: 1.6;
            margin-bottom: 16px;
        }

        .modal-instruction ol {
            padding-left: 20px;
            margin: 10px 0;
        }

        .modal-instruction li {
            margin-bottom: 8px;
        }

        .modal-instruction a {
            color: var(--primary);
        }

        .modal-input-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.95rem;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .btn {
            padding: 8px 18px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #d0d0d0;
        }

        .btn-primary {
            background: #2563eb;
            color: #fff;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        /* ─── Responsive ─── */
        @media (max-width: 640px) {
            body {
                padding: 12px 6px;
            }

            .container {
                padding: 20px 14px;
                border-radius: 10px;
            }

            .header-left h2 {
                font-size: 1.3rem;
            }

            .header-left p {
                font-size: 0.75rem;
            }

            .settings-btn {
                width: 36px;
                height: 36px;
                font-size: 1.1rem;
            }

            .profile-bar {
                flex-direction: column;
                align-items: stretch;
                padding: 12px;
            }

            .profile-bar select {
                flex: 1 1 auto;
                min-width: unset;
            }

            .profile-bar .btn-danger {
                align-self: flex-end;
            }

            .gender-segmented {
                gap: 8px;
            }

            .gender-label {
                padding: 10px;
                font-size: 0.88rem;
            }

            input[type="text"],
            input[type="datetime-local"] {
                padding: 10px 12px;
                font-size: 0.92rem;
            }

            .btn-submit {
                padding: 12px;
                font-size: 0.98rem;
            }

            #report-preview {
                height: 520px;
            }

            .btn-print {
                padding: 10px 20px;
                font-size: 0.88rem;
                width: 100%;
                max-width: 280px;
                text-align: center;
            }

            .modal-card {
                padding: 20px 16px;
                width: 95%;
            }
        }

        @media (max-width: 400px) {
            .container {
                padding: 16px 10px;
            }

            .header-left h2 {
                font-size: 1.1rem;
            }

            .gender-segmented {
                grid-template-columns: 1fr 1fr;
                gap: 6px;
            }

            .gender-label {
                padding: 8px;
                font-size: 0.82rem;
            }

            #report-preview {
                height: 400px;
            }
        }

        @media print {
            body {
                background: #fff;
                padding: 0;
            }
            .container,
            .btn-print,
            .profile-bar,
            .loading-text,
            #report-preview {
                display: none !important;
            }
        }
    </style>
</head>
<body>

    <!-- ─── Main Container ─── -->
    <div class="container">

        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <h2>八字經典命理分析</h2>
                <p>匯集四家經典精析排盤 · 探尋命理玄機</p>
            </div>
            <button id="openSettingsBtn" class="settings-btn" title="設置 Gemini API Key">⚙️</button>
        </div>

        <!-- Profile Bar -->
        <div class="profile-bar">
            <select id="userProfiles" onchange="loadSelectedProfile()">
                <option value="">-- 選擇已保存緣主 --</option>
            </select>
            <button type="button" class="btn-danger" onclick="deleteSelectedProfile()">刪除</button>
        </div>

        <!-- Main Form -->
        <form id="baziForm" onsubmit="handleFormSubmit(event)">
            <div class="form-group">
                <label for="userName">緣主姓名</label>
                <input type="text" id="userName" placeholder="例如: 張三" required />
            </div>

            <div class="form-group">
                <label>性別</label>
                <div class="gender-segmented">
                    <div class="gender-option">
                        <input type="radio" id="genderMale" name="gender" value="男" checked />
                        <label for="genderMale" class="gender-label">乾造 (男)</label>
                    </div>
                    <div class="gender-option">
                        <input type="radio" id="genderFemale" name="gender" value="女" />
                        <label for="genderFemale" class="gender-label">坤造 (女)</label>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="datetime">陽曆出生時間</label>
                <input type="datetime-local" id="datetime" required />
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">生成命理分析報告</button>
        </form>

        <div id="loading" class="loading-text">☯ 正在匯集四家經典精析排盤，請稍候…</div>
    </div>

    <!-- ─── Print & Report ─── -->
    <!-- <button id="printBtn" class="btn-print" onclick="printIframeToPDF()">🖨 導出 / 打印 PDF 報告</button> -->
    <button class="btn-print" onclick="printIframeToPDF('color')">🖨️ 打印彩色 PDF</button>
    <button class="btn-print" onclick="printIframeToPDF('mono')">🖨️ 打印黑白 PDF</button>
    <iframe id="report-preview"></iframe>

    <!-- ─── API Key Modal ─── -->
    <div id="apiKeyModal" class="modal-overlay">
        <div class="modal-card">
            <h3 class="modal-title">設置 Gemini API Key 🔑</h3>
            <div class="modal-instruction">
                <h4 style="margin-top:0;">如何免費獲取 Gemini API Key</h4>
                <ol>
                    <li>前往 <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener">Google AI Studio</a> 並登錄。</li>
                    <li>點擊 <strong>"Create API key"</strong> 按鈕。</li>
                    <li>選擇項目生成新的 API 密鑰。</li>
                    <li>複製生成的以 <code>AIzaSy...</code> 或 <code>AQ...</code> 開頭的字串。</li>
                    <li>粘貼至下方輸入框（密鑰僅保存在本地瀏覽器）。</li>
                </ol>
                <p style="font-size:0.82rem; color:var(--muted);">* Gemini 提供免費額度（Free Tier），無需綁定信用卡。</p>
            </div>
            <div class="modal-input-group">
                <input type="password" id="apiKeyInput" placeholder="輸入 AIzaSy... 或 AQ... 密鑰" />
            </div>
            <div class="modal-actions">
                <button type="button" id="cancelApiKeyBtn" class="btn btn-secondary">取消</button>
                <button type="button" id="saveApiKeyBtn" class="btn btn-primary">保存</button>
            </div>
        </div>
    </div>

    <script>
        // ─── Constants ───
        const API_ENDPOINT = 'https://bazi-report-backend.tmaxius.workers.dev/generate-report';
        const STORAGE_PROFILES_KEY = 'bazi_user_profiles';
        const STORAGE_API_KEY = 'bazi_gemini_api_key';

        // ─── DOM refs ───
        const form = document.getElementById('baziForm');
        const userName = document.getElementById('userName');
        const datetime = document.getElementById('datetime');
        const submitBtn = document.getElementById('submitBtn');
        const loading = document.getElementById('loading');
        const iframe = document.getElementById('report-preview');
        const printBtn = document.getElementByClass('btn-print');
        const profilesSelect = document.getElementById('userProfiles');
        const genderRadios = document.querySelectorAll('input[name="gender"]');

        // ─── Modal refs ───
        const apiKeyModal = document.getElementById('apiKeyModal');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const saveApiKeyBtn = document.getElementById('saveApiKeyBtn');
        const cancelApiKeyBtn = document.getElementById('cancelApiKeyBtn');
        const openSettingsBtn = document.getElementById('openSettingsBtn');

        // ─── 🆕 清空報告區域 ───
        function clearReport() {
            // 隱藏打印按鈕
            printBtn.style.display = 'none';
            // 隱藏 iframe
            iframe.style.display = 'none';
            // 清空 iframe 內容
            try {
                const doc = iframe.contentWindow.document;
                doc.open();
                doc.write('');
                doc.close();
            } catch (e) {
                // 如果跨域無法操作，至少隱藏 iframe
                iframe.src = 'about:blank';
            }
            // 隱藏 loading（如果顯示中）
            loading.style.display = 'none';
        }

        // ─── 🆕 監聽表單變化，自動清空報告 ───
        function bindClearOnChange() {
            // 監聽所有文字輸入、下拉選擇、單選按鈕的變化
            const inputs = [userName, datetime, profilesSelect, ...genderRadios];
            inputs.forEach(el => {
                el.addEventListener('change', clearReport);
                // 對於文字輸入，也監聽 input 事件（更即時）
                if (el.tagName === 'INPUT' && el.type !== 'radio' && el.type !== 'datetime-local') {
                    el.addEventListener('input', clearReport);
                }
                if (el.type === 'datetime-local') {
                    el.addEventListener('input', clearReport);
                }
            });
        }

        // ─── Initialize ───
        document.addEventListener('DOMContentLoaded', () => {
            loadProfilesDropdown();

            // Set default datetime to now (local)
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            datetime.value = now.toISOString().slice(0, 16);

            // Pre-fill API key input with saved key (if any)
            const savedKey = localStorage.getItem(STORAGE_API_KEY) || '';
            if (savedKey) apiKeyInput.value = savedKey;

            // 綁定清空事件
            bindClearOnChange();
        });

        // ─── API Key Modal logic ───
        function openModal() {
            apiKeyInput.value = localStorage.getItem(STORAGE_API_KEY) || '';
            apiKeyModal.style.display = 'flex';
        }

        function closeModal() {
            apiKeyModal.style.display = 'none';
        }

        openSettingsBtn.addEventListener('click', openModal);
        cancelApiKeyBtn.addEventListener('click', closeModal);

        saveApiKeyBtn.addEventListener('click', () => {
            const key = apiKeyInput.value.trim();
            if (key) {
                localStorage.setItem(STORAGE_API_KEY, key);
            } else {
                localStorage.removeItem(STORAGE_API_KEY);
            }
            closeModal();
        });

        // Close modal on backdrop click
        apiKeyModal.addEventListener('click', (e) => {
            if (e.target === apiKeyModal) closeModal();
        });

        // ─── Profile helpers ───
        function getProfiles() {
            try {
                return JSON.parse(localStorage.getItem(STORAGE_PROFILES_KEY) || '[]');
            } catch {
                return [];
            }
        }

        function saveProfiles(profiles) {
            localStorage.setItem(STORAGE_PROFILES_KEY, JSON.stringify(profiles));
        }

        function loadProfilesDropdown() {
            const profiles = getProfiles();
            profilesSelect.innerHTML = '<option value="">-- 選擇已保存緣主 --</option>';
            profiles.forEach((p, idx) => {
                const opt = document.createElement('option');
                opt.value = idx;
                opt.textContent = `${p.name} (${p.gender}) · ${p.datetime.replace('T', ' ')}`;
                profilesSelect.appendChild(opt);
            });
        }

        function loadSelectedProfile() {
            const idx = profilesSelect.value;
            if (idx === '') return;
            const p = getProfiles()[idx];
            if (p) {
                userName.value = p.name;
                document.querySelector(`input[name="gender"][value="${p.gender}"]`).checked = true;
                datetime.value = p.datetime;
            }
            // 🆕 載入後清空舊報告
            clearReport();
        }

        function saveProfile(name, gender, datetimeVal) {
            let profiles = getProfiles();
            const existing = profiles.findIndex(p => p.name === name && p.datetime === datetimeVal);
            if (existing > -1) {
                profiles[existing] = { name, gender, datetime: datetimeVal };
            } else {
                profiles.unshift({ name, gender, datetime: datetimeVal });
            }
            saveProfiles(profiles);
            loadProfilesDropdown();
        }

        function deleteSelectedProfile() {
            const idx = profilesSelect.value;
            if (idx === '') return alert('請選擇要刪除的緣主');
            const profiles = getProfiles();
            profiles.splice(idx, 1);
            saveProfiles(profiles);
            loadProfilesDropdown();
            // 🆕 刪除後清空報告
            clearReport();
        }

        // ─── Form submit ───
        async function handleFormSubmit(e) {
            e.preventDefault();

            // 🆕 清空舊報告（避免殘留）
            clearReport();

            // Get API key from localStorage
            const apiKey = localStorage.getItem(STORAGE_API_KEY);
            if (!apiKey) {
                alert('請先設置 Gemini API Key（點擊右上角齒輪按鈕）');
                openModal();
                return;
            }

            const name = userName.value.trim();
            if (!name) {
                alert('請輸入緣主姓名');
                userName.focus();
                return;
            }

            const gender = document.querySelector('input[name="gender"]:checked').value;
            const datetimeRaw = datetime.value;
            if (!datetimeRaw) {
                alert('請選擇出生時間');
                datetime.focus();
                return;
            }
            const datetimeStr = datetimeRaw.replace('T', ' ');

            // Save profile
            saveProfile(name, gender, datetimeRaw);

            // UI loading state
            submitBtn.disabled = true;
            loading.style.display = 'block';
            iframe.style.display = 'none';
            printBtn.style.display = 'none';

            try {
                const resp = await fetch(API_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, gender, datetime: datetimeStr, apiKey }),
                });

                if (!resp.ok) {
                    let msg = `伺服器回應 ${resp.status}`;
                    try {
                        const err = await resp.json();
                        msg = err.error || err.details || msg;
                    } catch (_) {
                        msg = await resp.text();
                    }
                    throw new Error(msg);
                }

                const html = await resp.text();

                iframe.style.display = 'block';
                printBtn.style.display = 'inline-block';

                const doc = iframe.contentWindow.document;
                doc.open();
                doc.write(html);
                doc.close();

                iframe.scrollIntoView({ behavior: 'smooth' });

            } catch (err) {
                alert('生成失敗: ' + err.message);
            } finally {
                submitBtn.disabled = false;
                loading.style.display = 'none';
            }
        }

        // ─── Print ───
        // function printIframeToPDF() {
        //     if (!iframe || iframe.style.display === 'none') {
        //         alert('沒有可供打印的報告');
        //         return;
        //     }
        //     iframe.contentWindow.focus();
        //     iframe.contentWindow.print();
        // }
        function printIframeToPDF(mode) {
              const iframe = document.getElementById("report-preview");
              if (!iframe || iframe.style.display === "none") {
                alert("没有可供打印的报告");
                return;
              }
            
              const doc = iframe.contentWindow.document;
              
              // 获取两个样式表 link 元素（须确保它们在 iframe 内已加载）
              const colorfulLink = doc.getElementById('colorful-print');
              const monoLink = doc.getElementById('monochrome-print');
            
              if (colorfulLink && monoLink) {
                if (mode === 'color') {
                  colorfulLink.disabled = false;   // 启用彩色
                  monoLink.disabled = true;        // 禁用黑白
                } else { // 'mono'
                  colorfulLink.disabled = true;    // 禁用彩色
                  monoLink.disabled = false;       // 启用黑白
                }
              }
            
              // 触发 iframe 打印
              iframe.contentWindow.focus();
              iframe.contentWindow.print();
            }

        // ─── 🆕 響應式 iframe 自適應高度（可選） ───
        // 由於報告內容可能很長，監聽 iframe load 事件動態調整高度
        iframe.addEventListener('load', function() {
            try {
                // 嘗試獲取 iframe 內容高度（同源策略允許）
                const doc = iframe.contentWindow.document;
                const height = doc.body.scrollHeight || doc.documentElement.scrollHeight;
                if (height > 100) {
                    iframe.style.height = Math.max(height + 40, 750) + 'px';
                }
            } catch (e) {
                // 跨域時忽略，保持預設高度
            }
        });
    </script>
