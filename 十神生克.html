<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>十神·五行 相生相克图</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:radial-gradient(ellipse at center,#1a1a3e 0%,#0a0a1a 100%);
  color:#e0d5c0;
  font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif;
  display:flex;flex-direction:column;align-items:center;
  min-height:100vh;padding:15px;
  user-select:none;
}
h1{font-size:26px;color:#f0c060;text-shadow:0 0 20px rgba(240,192,96,.5);margin-bottom:4px}
.sub{font-size:13px;color:#777;margin-bottom:10px}
svg{width:min(96vw,700px);height:min(96vw,700px)}
.controls{display:flex;gap:24px;margin-top:14px}
.controls button{
  padding:12px 26px;font-size:17px;font-family:inherit;
  border:2px solid #f0c060;background:rgba(240,192,96,.08);
  color:#f0c060;border-radius:10px;cursor:pointer;transition:.3s;
}
.controls button:hover{background:rgba(240,192,96,.25);box-shadow:0 0 18px rgba(240,192,96,.3)}
.controls button:active{transform:scale(.95)}

/* 表格容器 - 支持横向滚动 */
.table-wrapper{
  margin-top:12px;
  width:100%;
  max-width:700px;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
}
#info{
  width:100%;
  border-collapse:collapse;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(240,192,96,.15);
  border-radius:8px;
  overflow:hidden;
}
#info th,#info td{
  padding:10px 8px;
  text-align:center;
  border:1px solid rgba(240,192,96,.1);
  font-size:15px;
}
#info th{
  background:rgba(240,192,96,.12);
  color:#f0c060;
  font-weight:600;
  font-size:14px;
}
#info td{
  font-weight:500;
  font-size:16px;
}
#info td:first-child{
  font-weight:600;
}

.legend{display:flex;gap:18px;margin-top:8px;font-size:12px;color:#888;flex-wrap:wrap;justify-content:center}
.legend i{display:inline-block;width:28px;height:3px;border-radius:2px;vertical-align:middle;margin-right:3px}
#inner-group{transition:transform .6s cubic-bezier(.4,0,.2,1)}
#rz-circle, #rz-text, #rz-sub { transition: fill 0.6s ease, stroke 0.6s ease; }

/* 移动端适配 */
@media (max-width: 600px) {
  h1{font-size:22px}
  .sub{font-size:12px}
  .controls button{padding:10px 20px;font-size:15px}
  #info th{font-size:12px;padding:8px 4px}
  #info td{font-size:14px;padding:8px 4px}
}
</style>
</head>
<body>
<h1>☯ 十神 · 五行 相生相克图</h1>
<p class="sub">转动内环五行，使对应元素对齐十神方位（如日主为火，则转"火"至比劫位）</p>

<svg id="svg" viewBox="0 0 700 700"></svg>

<div class="controls">
  <button onclick="rotate(-1)">↺ 逆转 72°</button>
  <button onclick="rotate(1)">↻ 顺转 72°</button>
</div>

<div class="table-wrapper">
  <table id="info"></table>
</div>

<div class="legend">
  <span><i style="background:#4ade80"></i>相生</span>
  <span><i style="background:#f87171;border-top:2px dashed #f87171;height:0"></i>相克</span>
</div>

<script>
const CX=350,CY=350,OR=232,IR=122,NOR=50,NIR=34;
const NS='http://www.w3.org/2000/svg';

const TG=[
  {p:['比肩','劫财'],g:'比劫'},
  {p:['食神','伤官'],g:'食伤'},
  {p:['偏财','正财'],g:'财星'},
  {p:['七杀','正官'],g:'官杀'},
  {p:['偏印','正印'],g:'印星'}
];
const WX=[
  {n:'木',c:'#22c55e',g:'#15803d'},
  {n:'火',c:'#ef4444',g:'#b91c1c'},
  {n:'土',c:'#eab308',g:'#a16207'},
  {n:'金',c:'#e2e8f0',g:'#64748b'},
  {n:'水',c:'#3b82f6',g:'#1d4ed8'}
];

let steps=0;
const a=i=>(-90+i*72)*Math.PI/180;
const pt=(i,r)=>({x:CX+r*Math.cos(a(i)),y:CY+r*Math.sin(a(i))});

function arc(r,a1,a2){
  const x1=CX+r*Math.cos(a1),y1=CY+r*Math.sin(a1);
  const x2=CX+r*Math.cos(a2),y2=CY+r*Math.sin(a2);
  let d=a2-a1; if(d<0)d+=2*Math.PI;
  return`M${x1} ${y1}A${r} ${r} 0 ${d>Math.PI?1:0} 1 ${x2} ${y2}`;
}

function build(){
  const svg=document.getElementById('svg');
  let h=`<defs>
    <marker id="ag" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0L9,3.5L0,7Z" fill="#4ade80"/></marker>
    <marker id="ar" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0L9,3.5L0,7Z" fill="#f87171"/></marker>
    <marker id="at" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0L9,3.5L0,7Z" fill="#2dd4bf"/></marker>
    <filter id="gl"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="gl2"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="bg"><stop offset="0%" stop-color="#1e1e4a"/><stop offset="100%" stop-color="#0a0a1a"/></radialGradient>
  </defs>`;

  h+=`<circle cx="${CX}" cy="${CY}" r="340" fill="url(#bg)"/>`;
  h+=`<circle cx="${CX}" cy="${CY}" r="${OR+25}" fill="none" stroke="rgba(240,192,96,.08)" stroke-width="1"/>`;
  h+=`<circle cx="${CX}" cy="${CY}" r="${OR}" fill="none" stroke="rgba(240,192,96,.12)" stroke-width="1" stroke-dasharray="5,5"/>`;
  h+=`<circle cx="${CX}" cy="${CY}" r="${IR}" fill="none" stroke="rgba(100,200,255,.12)" stroke-width="1" stroke-dasharray="5,5"/>`;

  const oA=OR+20, off=21*Math.PI/180;
  for(let i=0;i<5;i++){
    const j=(i+1)%5;
    h+=`<path d="${arc(oA,a(i)+off,a(j)-off)}" fill="none" stroke="#4ade80" stroke-width="2.5" marker-end="url(#ag)" opacity=".65"/>`;
  }

  for(let i=0;i<5;i++){
    const j=(i+2)%5;
    const p1=pt(i,OR-NOR-8),p2=pt(j,OR-NOR-8);
    const dx=p2.x-p1.x,dy=p2.y-p1.y,l=Math.hypot(dx,dy);
    const ux=dx/l,uy=dy/l;
    h+=`<line x1="${p1.x+ux*8}" y1="${p1.y+uy*8}" x2="${p2.x-ux*12}" y2="${p2.y-uy*12}" stroke="#f87171" stroke-width="1.5" stroke-dasharray="7,5" marker-end="url(#ar)" opacity=".45"/>`;
  }

  h+=`<text x="${CX}" y="42" text-anchor="middle" fill="#4ade80" font-size="12" opacity=".7">外环：十神相生（实线）· 相克（虚线）</text>`;

  for(let i=0;i<5;i++){
    const p=pt(i,OR),t=TG[i];
    h+=`<circle cx="${p.x}" cy="${p.y}" r="${NOR}" fill="rgba(25,25,55,.92)" stroke="#f0c060" stroke-width="2" filter="url(#gl)"/>`;
    h+=`<text x="${p.x}" y="${p.y-12}" text-anchor="middle" fill="#f0c060" font-size="18" font-weight="bold">${t.p[0]}</text>`;
    h+=`<text x="${p.x}" y="${p.y+14}" text-anchor="middle" fill="#f0c060" font-size="18" font-weight="bold">${t.p[1]}</text>`;
    h+=`<text x="${p.x}" y="${p.y+34}" text-anchor="middle" fill="rgba(240,192,96,.6)" font-size="12">〔${t.g}〕</text>`;
  }

  h+=`<g id="inner-group" style="transform-origin:${CX}px ${CY}px">`;

  const iA=IR+14, iOff=28*Math.PI/180;
  for(let i=0;i<5;i++){
    const j=(i+1)%5;
    h+=`<path d="${arc(iA,a(i)+iOff,a(j)-iOff)}" fill="none" stroke="#2dd4bf" stroke-width="2" marker-end="url(#at)" opacity=".55"/>`;
  }

  for(let i=0;i<5;i++){
    const p=pt(i,IR),w=WX[i];
    h+=`<circle cx="${p.x}" cy="${p.y}" r="${NIR}" fill="${w.g}" stroke="${w.c}" stroke-width="2.5" filter="url(#gl)" opacity=".92"/>`;
    h+=`<text x="${p.x}" y="${p.y+8}" text-anchor="middle" fill="#fff" font-size="22" font-weight="bold" class="wt" data-i="${i}">${w.n}</text>`;
  }
  h+=`</g>`;

  h+=`<circle id="rz-circle" cx="${CX}" cy="${CY}" r="38" fill="#15803d" stroke="#22c55e" stroke-width="2.5" filter="url(#gl2)"/>`;
  h+=`<text id="rz-text" x="${CX}" y="${CY-2}" text-anchor="middle" fill="#fff" font-size="18" font-weight="bold">日主</text>`;
  h+=`<text id="rz-sub" x="${CX}" y="${CY+18}" text-anchor="middle" fill="rgba(255,255,255,.6)" font-size="11">太极</text>`;

  svg.innerHTML=h;
}

function update(){
  const g=document.getElementById('inner-group');
  const deg=steps*72;
  g.style.transform=`rotate(${deg}deg)`;

  g.querySelectorAll('.wt').forEach(t=>{
    const i=+t.dataset.i, p=pt(i,IR);
    t.setAttribute('transform',`rotate(${-deg},${p.x},${p.y})`);
  });

  const bijieWi = ((-steps) % 5 + 5) % 5;
  const bijieColor = WX[bijieWi].c;
  const bijieGrad = WX[bijieWi].g;

  const rzCircle = document.getElementById('rz-circle');
  const rzText = document.getElementById('rz-text');
  const rzSub = document.getElementById('rz-sub');

  if(rzCircle) {
    rzCircle.setAttribute('fill', bijieGrad);
    rzCircle.setAttribute('stroke', bijieColor);
  }
  if(rzSub) {
    rzSub.setAttribute('fill', 'rgba(255,255,255,.7)');
  }

  // 构建表格
  let tableHtml = '<tr><th>日主</th>';
  for(let i=0;i<5;i++){
    tableHtml += `<th>${TG[i].g}</th>`;
  }
  tableHtml += '</tr><tr>';
  
  // 日主列
  tableHtml += `<td style="color:${bijieColor}">${WX[bijieWi].n}</td>`;
  
  // 其他十神列
  for(let i=0;i<5;i++){
    const wi=((i-steps)%5+5)%5;
    tableHtml += `<td style="color:${WX[wi].c}">${WX[wi].n}</td>`;
  }
  tableHtml += '</tr>';

  document.getElementById('info').innerHTML = tableHtml;
}

function rotate(d){steps+=d;update();}

build();
update();
</script>
</body>
</html>
