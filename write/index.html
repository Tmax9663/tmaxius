<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#FFF8E7" />
<title>Trace With Me</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="topbar">
  <button id="btnHome" class="icon-btn" aria-label="Home">🏠</button>
  <div class="task-title">
    <span class="task-label">Today</span>
    <span class="task-char" id="taskChar">A</span>
  </div>
  <button id="btnHelp" class="icon-btn" aria-label="Help">💡</button>
</header>

<main class="stage">
  <canvas id="canvas" class="canvas"></canvas>

  <div class="progress-ring">
    <svg viewBox="0 0 60 60" width="60" height="60">
      <circle cx="30" cy="30" r="24" fill="transparent" stroke="#FFE0B2" stroke-width="7"/>
      <circle id="ringFill" cx="30" cy="30" r="24" fill="transparent"
              stroke="#FF7043" stroke-width="7" stroke-linecap="round"
              stroke-dasharray="150.8 150.8" stroke-dashoffset="150.8"
              transform="rotate(-90 30 30)"/>
    </svg>
    <span id="ringText" class="ring-text">0%</span>
  </div>

  <div class="stars" id="stars"></div>
  <div class="start-hint" id="startHint">👆 Start here</div>
</main>

<footer class="toolbar">
  <button class="tool-btn" id="btnPrev">◀</button>
  <button class="tool-btn primary" id="btnSkip">Skip 🔄</button>
  <button class="tool-btn" id="btnNext">▶</button>
</footer>

<div class="parent-panel" id="parentPanel">
  <div class="parent-card">
    <h2>Parent / Teacher Settings</h2>

    <label class="row">
      <span>Pass threshold</span>
      <input type="range" id="passThreshold" min="50" max="100" value="75" />
      <b id="passThresholdVal">75%</b>
    </label>

    <label class="row">
      <span>Brush size</span>
      <input type="range" id="brushSize" min="8" max="40" value="22" />
      <b id="brushSizeVal">22</b>
    </label>

    <label class="row">
      <span>Brush color</span>
      <input type="color" id="brushColor" value="#FF7043" />
    </label>

    <label class="row">
      <span>Sound</span>
      <input type="checkbox" id="soundOn" checked />
    </label>

    <label class="row">
      <span>Vibration</span>
      <input type="checkbox" id="vibrateOn" checked />
    </label>

    <label class="row">
      <span>Custom characters</span>
      <textarea id="customChars" rows="3" placeholder="A,B,C or 1,2,3"></textarea>
    </label>

    <div class="row buttons">
      <button id="btnApply">Apply</button>
      <button id="btnCloseParent">Close</button>
    </div>
  </div>
</div>

<div class="celebrate" id="celebrate">
  <div class="celebrate-inner">
    <div class="celebrate-emoji">🎉</div>
    <div class="celebrate-text">Great job!</div>
    <button class="celebrate-next" id="btnCelebrateNext">Next ➡️</button>
  </div>
</div>

<script src="app-special.js"></script>
</body>
</html>
