<html lang="en">
  <head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="Author" content="maxt9663@gmail.com" />
    <meta name="description" content="FxDraw the use of the Web Application Manifest.">
    <meta name="KeyWords" content="Word, Canvas Draw, Games">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f00">
    <link rel="icon" href="images/favicon.png">
    <title>Word Workshop</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div id="modal" class="modal">
      <div class="container">
        <h1 style="width: 83vw;background-color: #373206;margin-left: -11px;margin-top: -11px;border-radius: 5px;padding: 5px;">Congratulations!</h1>
        <h2>Play again?</h2>
        <div class="clearfix">
          <button type="button" onclick="document.querySelector('#modal').style.display='none'" class="btnCancel">Cancel</button>
          <button type="button" onclick="document.querySelector('#modal').style.display='none';ok=true;" class="btnOk">Play</button>
        </div>
      </div>
    </div>
    <div align="center"><h1 style="word-spacing: 3px;">Word Workshop</h1>
    <canvas class="canvas" id="canvas"></canvas></div>
    <div align="center">
      <table>
        <tr>
          <td>
            <div id="svgDiv">
              <svg width="150px" height="150px" viewBox="0 0 50 50" class="donut"></svg>
            </div>
          </td>
          <td>
            <span id="totalPoint"></span>
          </td>
        </tr>
        <tr>
          <td>
            <input id='slider' type="range" min="2" max="30" value="17">
          </td>
          <td>
            <label id="lblSlider"></label>
          </td>
        </tr>
        <tr>
          <td>
            <input id='sliderOpac' type="range" min="1" max="10" value="10">
          </td>
          <td>
            <label id="lblSliderOpac"></label>
          </td>
        </tr>
      </table>
    </div>
    <canvas id="colorWheel" style="display:none"></canvas>
    <div class="footerClass">
        <input id="inpText" type="text" style="width:50px;" />
        &nbsp;<a href="javascript:void(0);" class="myButton" title="Home" id="btnDrawText">DrawText</a>
      &nbsp;<a href="javascript:void(0);" class="myButton" title="Home" id="btnDraw">Draw</a>
      &nbsp;<a href="javascript:void(0);" class="myButton" title="Home" id="btnSave">Save</a>
      &nbsp;<a href="javascript:void(0);" class="myButton" title="Home" id="btnClear">Clear</a>
      &nbsp;<a href="javascript:void(0);" class="myButton" title="Home" id="btnColor">Color</a>
      </div>
    <script src="app_special.js" charset="utf-8"></script>
  </body>
</html>
