<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>十神喜忌录入表</title>
    <style>
        /* Basic Screen Styling */
        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            margin: 20px;
            color: #333;
            background-color: #f9f9f9;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            border-radius: 8px;
        }
        h2 {
            text-align: center;
            margin-bottom: 5px;
        }
        .instructions {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .controls {
            text-align: center;
            margin-bottom: 25px;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            color: #fff;
            background-color: #007BFF;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }

        /* Table Styling */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #555;
            padding: 0;
            text-align: center;
            vertical-align: middle;
        }
        th {
            background-color: #f4f4f4;
            padding: 12px 8px;
            font-weight: bold;
        }
        td:first-child {
            font-weight: bold;
            background-color: #fafafa;
            width: 15%;
            padding: 10px;
        }
        
        /* Input Fields Styling */
        textarea {
            width: 100%;
            height: 70px;
            border: none;
            resize: none;
            font-size: 15px;
            font-family: inherit;
            box-sizing: border-box;
            padding: 8px;
            text-align: center;
            background: transparent;
        }
        textarea:focus {
            outline: none;
            background-color: #eef6ff;
        }

        /* Print / PDF Styling */
        @media print {
            @page {
                size: A4 landscape; /* or portrait, depending on preference */
                margin: 1.5cm;
            }
            body {
                margin: 0;
                padding: 0;
                background: #fff;
            }
            .container {
                box-shadow: none;
                padding: 0;
                max-width: 100%;
            }
            .controls, .instructions, h2 {
                display: none !important; /* Hide UI elements when printing */
            }
            table {
                font-size: 12pt;
                page-break-inside: avoid;
            }
            th, td {
                border: 1.5px solid #000;
                padding: 10px;
            }
            td:first-child {
                background-color: #fff !important;
            }
            textarea {
                border: none;
                background: transparent;
                height: auto;
                min-height: 50px;
                overflow: hidden;
                font-size: 12pt;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>十神喜忌对照表</h2>
    <p class="instructions">请在下方表格的空白处录入内容。录入完成后，点击底部按钮即可打印或保存为 PDF。</p>
    
    <div class="controls">
        <button onclick="window.print()">🖨️ 打印 / 保存为 PDF</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>十神</th>
              
                <th>喜神</th>
                <th>忌神</th>
               
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>正印</td>
                <td><textarea ></textarea></td>
                <td><textarea ></textarea></td>
                
            </tr>
            <tr>
                <td>偏印</td>
                <td><textarea ></textarea></td>
                <td><textarea ></textarea></td>
                
            </tr>
            <tr>
                <td>比肩</td>
                <td><textarea ></textarea></td>
                <td><textarea ></textarea></td>
                
            </tr>
            <tr>
                <td>却财</td>
                <td><textarea ></textarea></td>
                <td><textarea ></textarea></td>
                
            </tr>
            <tr>
                <td>伤官</td>
                <td><textarea ></textarea></td>
                <td><textarea ></textarea></td>
                
            </tr>
            <tr>
                <td>食神</td>
                <td><textarea ></textarea></td>
                <td><textarea ></textarea></td>
                
            </tr>
            <tr>
                <td>正财</td>
                <td><textarea ></textarea></td>
                <td><textarea ></textarea></td>
                
            </tr>
            <tr>
                <td>偏财</td>
                <td><textarea ></textarea></td>
                <td><textarea ></textarea></td>
                
            </tr>
            <tr>
                <td>正官</td>
                <td><textarea ></textarea></td>
                <td><textarea ></textarea></td>
                
            </tr>
            <tr>
                <td>七杀</td>
                <td><textarea ></textarea></td>
                <td><textarea ></textarea></td>
                
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
